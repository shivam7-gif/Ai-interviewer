version: "3.9"

services:
  # ── PostgreSQL Database ──────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: interviewos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-interviewos}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-interviewos}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - interviewos-net

  # ── Backend API & AI Service ─────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: interviewos-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-interviewos}
      CORS_ORIGIN: "http://localhost:5173,http://localhost:80,http://localhost"
      LIVEKIT_URL: ${LIVEKIT_URL:-wss://your-livekit.livekit.cloud}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-your_api_key}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-your_api_secret}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-key}
    ports:
      - "3001:3001"
    networks:
      - interviewos-net

  # ── Frontend SPA & Nginx Gateway ─────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend/app
      dockerfile: Dockerfile
      args:
        VITE_BACKEND_URL: "http://localhost:3001"
        VITE_GOOGLE_CLIENT_ID: "${VITE_GOOGLE_CLIENT_ID:-}"
    container_name: interviewos-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - interviewos-net

volumes:
  postgres_data:
    driver: local

networks:
  interviewos-net:
    driver: bridge
